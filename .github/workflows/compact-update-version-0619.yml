name: Compact updater version display 2026090619

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compact-update-version-0619.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact version display and publish
        shell: bash
        run: |
          set -euo pipefail

          TARGET="plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py"
          BUILD="2026090619"
          TAG="build-${BUILD}"
          EXPECTED_SHA="67eb35dedb351bfa95b21b6be83e9b31a96ceadbee3f5126a51a6f76077594a5"

          test -f "$TARGET"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py")
          data = path.read_text()
          data = data.replace(
              "PLUGIN_UPDATE_BUILD = 2026090618",
              "PLUGIN_UPDATE_BUILD = 2026090619",
              1,
          )
          old = '''def _embyflow_update_display_version(value):\n    value = str(value or "–")\n    if value.startswith("2026-"):\n        value = value[5:]\n    value = value.replace("-LOGINREF", "-REF")\n    return value\n'''
          new = '''def _embyflow_update_display_version(value):\n    value = str(value or "–").strip()\n    if value.startswith("2026-"):\n        value = value[5:]\n    value = value.replace("LOGINREF", "REF")\n\n    parts = [part.strip() for part in value.split("-") if part.strip()]\n    compact = []\n    for part in parts:\n        upper = part.upper()\n        if upper.startswith("RCDEV") or upper.startswith("SERVERSAFE"):\n            continue\n        compact.append(part)\n\n    if compact:\n        return " · ".join(compact[-3:])\n    return value\n'''
          if old not in data:
              raise SystemExit("old display helper not found")
          data = data.replace(old, new, 1)
          path.write_text(data)
          PY

          grep -q '^PLUGIN_UPDATE_BUILD = 2026090619$' "$TARGET"
          python3 -m py_compile "$TARGET"
          SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$SHA" = "$EXPECTED_SHA"

          cat > update.json <<'JSON'
          {
            "version": "2026-RCDEV7-SERVERSAFE1-LOGINREF17-DREAMSAFE2-PUBLICCLEAN1",
            "build": 2026090619,
            "channel": "rcdev",
            "download": "https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/build-2026090619/plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py",
            "sha256": "67eb35dedb351bfa95b21b6be83e9b31a96ceadbee3f5126a51a6f76077594a5",
            "target": "plugin.py",
            "artifact_type": "plugin_py",
            "changelog": [
              "4K HEVC/Main10/Dolby Vision: native Direct Play über Static=true statt unnötigem H.264-Volltranscode",
              "H.264 über 1920 Pixel Breite und AV1 behalten den sicheren H.264-Kompatibilitätsfallback",
              "HTTP-Pool: belegte Slots blockieren den nächsten Filmstart nicht mehr; Requests weichen non-blocking aus",
              "SERVERSAFE1: Stopped + ActiveEncodings-Cleanup bleiben für Transcode-/Ersatz-Sessions erhalten",
              "Resume/Seek und das eigene Untertitel-Auswahlmenü bleiben unverändert erhalten",
              "PUBLICCLEAN1: normale lokale Diagnose-/Testlogs sind standardmäßig deaktiviert; Fehler-/Crashlogs bleiben aktiv",
              "Update-Seite: Versionsanzeige auf REF17 · DREAMSAFE2 · PUBLICCLEAN1 gekürzt"
            ]
          }
          JSON

          python3 -m json.tool update.json >/dev/null

          git config user.name "EmbyFlowE2 Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$TARGET" update.json
          git commit -m "Compact updater version display build ${BUILD}"
          git push origin HEAD:main
          git tag -a "$TAG" -m "EmbyFlowE2 compact updater display build ${BUILD}"
          git push origin "$TAG"

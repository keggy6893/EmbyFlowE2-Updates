name: RC26.5 Actions history cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc26-5-action-history-cleanup.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Remove historical Actions runs without touching releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: keggy6893/EmbyFlowE2-Updates
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id' | sort -u > /tmp/old-runs.txt
          echo "Historical completed runs to remove: $(wc -l </tmp/old-runs.txt)"
          failures=0
          while IFS= read -r id; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" ]] || continue
            if ! gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null; then
              echo "Could not remove run: $id"
              failures=$((failures + 1))
            fi
          done < /tmp/old-runs.txt
          echo "Failures: $failures"
          test "$failures" -eq 0

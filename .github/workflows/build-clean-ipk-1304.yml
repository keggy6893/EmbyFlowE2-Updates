name: Build clean RCDEV13 IPK 2026091304

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-clean-ipk-1304.yml'
      - '.github/build_clean_ipk_1304.py'
      - '.github/inspect_clean_ipk_1304.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect privacy matches with address redacted
        run: python3 .github/inspect_clean_ipk_1304.py

      - name: Build and validate clean IPK
        run: python3 .github/build_clean_ipk_1304.py

      - name: Upload clean IPK
        uses: actions/upload-artifact@v4
        with:
          name: embyflowe2-clean-ipk-2026091304
          path: |
            enigma2-plugin-extensions-embyflowe2_2026.09.13.rcdev13-navv30-discoverfix1-navread1-arrowvis2-publicclean1_all.ipk
            enigma2-plugin-extensions-embyflowe2_2026.09.13.rcdev13-navv30-discoverfix1-navread1-arrowvis2-publicclean1_all.ipk.sha256
          if-no-files-found: error
          retention-days: 7

name: Build clean RCDEV13 IPK 2026091304

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-clean-ipk-1304.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate public 1304 source and build clean IPK
        shell: bash
        run: |
          set -euo pipefail
          SRC='plugin_RCDEV13_SERVERSAFE1_LOGINV21_FAVRES28_NAVV30_DISCOVERFIX1_NAVREAD1_ARROWVIS2_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          EXPECTED='af7d1f09d071f4bf3f48a2476ece04ec6dd7ca3a3f4553cd9dbb4c3fc8d0dbe5'
          OUT='enigma2-plugin-extensions-embyflowe2_2026.09.13.rcdev13-navv30-discoverfix1-navread1-arrowvis2-publicclean1_all.ipk'
          test -f "$SRC"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          grep -Fq 'PLUGIN_UPDATE_BUILD = 2026091304' "$SRC"
          grep -Fq '2026-RCDEV13-SERVERSAFE1-DREAMSAFE2-LOGINV21-FAVRES28-NAVV30-DISCOVERFIX1-NAVREAD1-ARROWVIS2-PUBLICCLEAN1' "$SRC"
          python3 -m py_compile "$SRC"
          for marker in UTFIX16 UTFIX20 PGS_HLS_RETRY_PROXY TRANSCODE_RECOVERY; do
            if grep -Fq "$marker" "$SRC"; then echo "Forbidden experimental marker found: $marker" >&2; exit 1; fi
          done
          if grep -En '(["'"'])(192\.168\.|10\.[0-9]{1,3}\.|172\.(1[6-9]|2[0-9]|3[01])\.)' "$SRC" > /tmp/private-ip-hits.txt; then
            echo 'Private LAN address found in public source; refusing package.' >&2; exit 1
          fi
          rm -rf ipkroot control debian-binary control.tar.gz data.tar.gz "$OUT"
          PLUGDIR='ipkroot/usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2'
          mkdir -p "$PLUGDIR" control
          cp "$SRC" "$PLUGDIR/plugin.py"
          : > "$PLUGDIR/__init__.py"
          cat > "$PLUGDIR/keymap.xml" <<'EOF'
          <keymap>
              <map context="EmbyFlowE2Actions">
                  <key id="KEY_RED" mapto="red" flags="m" />
                  <key id="KEY_GREEN" mapto="green" flags="m" />
                  <key id="KEY_YELLOW" mapto="yellow" flags="m" />
                  <key id="KEY_BLUE" mapto="blue" flags="m" />
                  <key id="KEY_BACK" mapto="cancel" flags="m" />
                  <key id="KEY_EXIT" mapto="cancel" flags="m" />
              </map>
          </keymap>
          EOF
          cat > control/control <<'EOF'
          Package: enigma2-plugin-extensions-embyflowe2
          Version: 2026.09.13.rcdev13-navv30-discoverfix1-navread1-arrowvis2-publicclean1
          Description: EmbyFlowE2 for Enigma2 (RCDEV13 NAVV30 DISCOVERFIX1 NAVREAD1 ARROWVIS2 PUBLICCLEAN1)
          Architecture: all
          Section: extra
          Priority: optional
          Maintainer: EmbyFlowE2
          EOF
          mapfile -t PAYLOAD < <(find ipkroot -type f -printf '%P\n' | sort)
          EXPECTED_FILES=('usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2/__init__.py' 'usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2/keymap.xml' 'usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2/plugin.py')
          test "${#PAYLOAD[@]}" -eq 3
          for i in 0 1 2; do test "${PAYLOAD[$i]}" = "${EXPECTED_FILES[$i]}"; done
          if find ipkroot -type f | grep -E '/etc/enigma2|/tmp/|cache|\.log$|poster' ; then
            echo 'State/cache/log file found in package payload; refusing package.' >&2; exit 1
          fi
          printf '2.0\n' > debian-binary
          tar --owner=0 --group=0 --numeric-owner -czf control.tar.gz -C control control
          tar --owner=0 --group=0 --numeric-owner -czf data.tar.gz -C ipkroot .
          ar r "$OUT" debian-binary control.tar.gz data.tar.gz
          test "$(ar t "$OUT" | paste -sd ' ' -)" = 'debian-binary control.tar.gz data.tar.gz'
          mkdir -p /tmp/ipkcheck
          tar -xzf data.tar.gz -C /tmp/ipkcheck
          test "$(sha256sum /tmp/ipkcheck/usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2/plugin.py | awk '{print $1}')" = "$EXPECTED"
          python3 -m py_compile /tmp/ipkcheck/usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2/plugin.py
          sha256sum "$OUT" > "$OUT.sha256"
          echo '--- CLEAN IPK CHECK ---'
          ar t "$OUT"
          tar -tzf data.tar.gz | sort
          cat "$OUT.sha256"

      - name: Upload clean IPK
        uses: actions/upload-artifact@v4
        with:
          name: embyflowe2-clean-ipk-2026091304
          path: |
            enigma2-plugin-extensions-embyflowe2_2026.09.13.rcdev13-navv30-discoverfix1-navread1-arrowvis2-publicclean1_all.ipk
            enigma2-plugin-extensions-embyflowe2_2026.09.13.rcdev13-navv30-discoverfix1-navread1-arrowvis2-publicclean1_all.ipk.sha256
          if-no-files-found: error
          retention-days: 7

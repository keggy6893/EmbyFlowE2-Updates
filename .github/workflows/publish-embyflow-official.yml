                          item.size=len(payload)
                          replaced+=1
                      dest.addfile(item,io.BytesIO(payload) if payload is not None else None)
              assert replaced==1,(replace_path,replaced)
              return buf.getvalue()
          data=subprocess.check_output(['ar','p',str(baseline),'data.tar.gz'])
          data=tar_rewrite(data,'usr/lib/enigma2/python/Plugins/Extensions/EmbyFlowE2/plugin.py',plugin)
          ctrl=subprocess.check_output(['ar','p',str(baseline),'control.tar.gz'])
          def update_control(raw):
              old=raw.decode()
              changed=re.sub(r'(?m)^Version:.*$', 'Version: 2026.11.15.1-r'+build,old,count=1)
              changed=re.sub(r'(?m)^Description:.*$', 'Description: EmbyFlowE2 '+tag+' official update',changed,count=1)
              assert changed!=old
              return changed.encode()
          ctrl=tar_rewrite(ctrl,'control',update_control)
          import tempfile
          with tempfile.TemporaryDirectory() as td:
              dir=pathlib.Path(td)
              (dir/'debian-binary').write_bytes(b'2.0\n')
              (dir/'control.tar.gz').write_bytes(ctrl)
              (dir/'data.tar.gz').write_bytes(data)
              subprocess.run(['ar','q',str(out.resolve()),'debian-binary','control.tar.gz','data.tar.gz'],cwd=dir,check=True)
          assert out.stat().st_size>500000
          from hashlib import sha256
          extracted=tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['ar','p',str(out),'data.tar.gz'])))
          stored=next(m for m in extracted.getmembers() if m.name.endswith('/plugin.py'))
          assert extracted.extractfile(stored).read()==plugin

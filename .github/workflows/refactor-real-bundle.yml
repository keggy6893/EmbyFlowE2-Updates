name: Build real RC26.9 modular update bundle
on:
  push:
    branches: ['refactor/rc26-9-foundation']
    paths:
      - 'tools/build_receiver_bundle.py'
      - 'tests/test_real_modular_bundle.py'
      - 'tools/bundle_transport.py'
      - 'tests/test_bundle_transport.py'
      - 'tools/update_router.py'
      - 'tests/test_update_router.py'
      - 'tools/modular_tar_bridge.py'
      - 'tests/test_modular_tar_bridge.py'
      - 'tools/audit_receiver_updater.py'
      - 'tests/test_audit_receiver_updater.py'
      - 'tools/integrate_update_menu.py'
      - 'tests/test_integrate_update_menu.py'
      - '.github/workflows/refactor-real-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official RC26.9 baseline
        run: python3 tests/test_rc269_refactor_baseline.py
      - name: Verify full-size receiver bundle and simulated install/rollback
        run: python3 -m unittest discover -s tests -p 'test_real_modular_bundle.py' -v
      - name: Test pinned downloads, digest verification, safe installation
        run: python3 -m unittest discover -s tests -p 'test_bundle_transport.py' -v
      - name: Check backward-compatible update routing
        run: python3 -m unittest discover -s tests -p 'test_update_router.py' -v
      - name: Verify modular tar.gz archive security and rollback
        run: python3 -m unittest discover -s tests -p 'test_modular_tar_bridge.py' -v
      - name: Audit existing receiver updater entry points
        run: python3 -m unittest discover -s tests -p 'test_audit_receiver_updater.py' -v
      - name: Test explicit modular GUI routing with legacy compatibility
        run: python3 -m unittest discover -s tests -p 'test_integrate_update_menu.py' -v
      - name: Upload isolated development bundle (never a release)
        uses: actions/upload-artifact@v4
        with:
          name: rc269-modular-dev-bundle-NOT-FOR-INSTALL
          path: refactor_candidates/rc269_bundle/
          retention-days: 7

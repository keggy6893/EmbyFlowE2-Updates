name: Emby-style server manager build 2026090632

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0632-server-manager-ui.yml'

permissions:
  contents: write

concurrency:
  group: embyflow-server-manager-ui-2026090632
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Emby-style server manager
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib

          plugin = Path('plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          manifest = Path('update.json')
          text = plugin.read_text(encoding='utf-8')

          if text.count('PLUGIN_UPDATE_BUILD = 2026090631') != 1:
              raise SystemExit('0631 baseline build marker mismatch')
          if '# EMBYFLOW_SERVER_MANAGER_V1_0631_RELEASE' not in text:
              raise SystemExit('0631 server manager marker missing')
          if '# EMBYFLOW_SERVER_MANAGER_UI_V2_0632_RELEASE' in text:
              raise SystemExit('0632 server manager UI already present')

          patch = zlib.decompress(base64.b64decode(
              ''
          )).decode('utf-8')

          text = text.replace(
              'PLUGIN_UPDATE_BUILD = 2026090631',
              'PLUGIN_UPDATE_BUILD = 2026090632',
              1,
          )
          text += patch
          plugin.write_text(text, encoding='utf-8', newline='\n')
          final_sha = hashlib.sha256(plugin.read_bytes()).hexdigest()

          data = json.loads(manifest.read_text(encoding='utf-8'))
          if int(data.get('build') or 0) != 2026090631:
              raise SystemExit('manifest baseline mismatch: %r' % data.get('build'))
          data['build'] = 2026090632
          data['download'] = 'https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/build-2026090632/plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          data['sha256'] = final_sha
          changelog = list(data.get('changelog') or [])
          messages = [
              'Serververwaltung 0632: natives Enigma2-ChoiceBox-Menü durch eigenes dunkles EmbyFlow-Servermenü ersetzt',
              'Servermenü 0632: EmbyFlow Cyan/Pink-Branding, große TV-taugliche Auswahlzeilen und klare Aktiv-Markierung',
              'Löschen 0632: Sicherheitsabfrage vollständig im EmbyFlow-Stil statt im nativen Enigma2-Dialog',
          ]
          for msg in messages:
              if msg not in changelog:
                  changelog.append(msg)
          data['changelog'] = changelog
          manifest.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print('Final plugin sha256:', final_sha)
          PY

          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090632' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_SERVER_MANAGER_UI_V2_0632_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'class EmbyFlowServerManageScreenV2' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EmbyFlowConnectionWizard.manage_server_slot = _embyflow_server_manager_v2_open' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EmbyFlowE2 Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m 'Add Emby-style server manager build 2026090632'
          git push origin main
          git tag -a build-2026090632 -m 'EmbyFlow E2 build 2026090632'
          git push origin build-2026090632

name: Metadata cache 48h expiry 2026090621

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metadata-cache-48h-0621.yml"

permissions:
  contents: write

concurrency:
  group: embyflow-metadata-cache-48h-2026090621
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 48h metadata cache expiry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          repo = Path(".")
          p = repo / "plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py"
          m = repo / "update.json"

          expected_before = "ba4cda78e422e4ca92685dbebeeb1eee147c3fbf7b5441f6e23032a62b13c41f"
          raw = p.read_bytes()
          got_before = hashlib.sha256(raw).hexdigest()
          if got_before != expected_before:
              raise SystemExit("Unexpected plugin baseline sha256: %s" % got_before)

          text = raw.decode("utf-8")

          old = 'PLUGIN_UPDATE_BUILD = 2026090620'
          new = 'PLUGIN_UPDATE_BUILD = 2026090621'
          if text.count(old) != 1:
              raise SystemExit("Build marker mismatch")
          text = text.replace(old, new, 1)

          old = '    MAX_STALE = 604800\n'
          new = '    MAX_STALE = 172800\n'
          if text.count(old) != 1:
              raise SystemExit("MAX_STALE marker mismatch")
          text = text.replace(old, new, 1)

          old = '''            if age > self.MAX_STALE:
                return None
          '''
          new = '''            if age > self.MAX_STALE:
                try:
                    os.remove(path)
                except Exception:
                    pass
                return None
          '''
          if text.count(old) != 1:
              raise SystemExit("Stale-load marker mismatch")
          text = text.replace(old, new, 1)

          helper = '''
    def _purge_stale_metadata_cache(self, protected_path=None):
        try:
            ensure_dir(METADATA_CACHE_DIR)
            now = time.time()
            protected_abs = os.path.abspath(protected_path) if protected_path else None
            for name in os.listdir(METADATA_CACHE_DIR):
                if not str(name).endswith(".json"):
                    continue
                path = os.path.join(METADATA_CACHE_DIR, name)
                try:
                    if protected_abs and os.path.abspath(path) == protected_abs:
                        continue
                    if (now - os.path.getmtime(path)) > self.MAX_STALE:
                        os.remove(path)
                except Exception:
                    pass
        except Exception:
            pass

          '''
          marker = '\n    def prune_metadata_cache'
          if marker not in text:
              raise SystemExit("prune_metadata_cache marker missing")
          if '_purge_stale_metadata_cache' in text:
              raise SystemExit("stale purge helper already exists")
          text = text.replace(marker, '\n' + helper + '    def prune_metadata_cache', 1)

          old = '''            try:
                self.prune_metadata_cache(
                    protected_path=path
                )
          '''
          new = '''            try:
                self._purge_stale_metadata_cache(protected_path=path)
            except Exception:
                pass

            try:
                self.prune_metadata_cache(
                    protected_path=path
                )
          '''
          if text.count(old) != 1:
              raise SystemExit("metadata cleaner call marker mismatch")
          text = text.replace(old, new, 1)

          old = (
              '    "Shadow35-Cache-Schutz: leere Metadatenantworten werden nicht gespeichert; "\n'
              '    "vorhandene leere Cacheeinträge werden verworfen"\n'
          )
          new = (
              '    "Shadow35-Cache-Schutz: leere Metadatenantworten werden nicht gespeichert; "\n'
              '    "vorhandene leere Cacheeinträge werden verworfen|"\n'
              '    "Metadaten-Cache: maximale Lebensdauer 48 Stunden; ältere JSON-Cachedateien werden entfernt"\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Embedded changelog marker mismatch")
          text = text.replace(old, new, 1)

          p.write_text(text, encoding="utf-8", newline="\n")
          final_sha = hashlib.sha256(p.read_bytes()).hexdigest()
          print("Final plugin sha256:", final_sha)

          data = json.loads(m.read_text(encoding="utf-8"))
          data["build"] = 2026090621
          data["download"] = (
              "https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/"
              "build-2026090621/"
              "plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py"
          )
          data["sha256"] = final_sha
          changelog = list(data.get("changelog") or [])
          msg = "Metadaten-Cache: maximale Lebensdauer 48 Stunden; ältere JSON-Cachedateien werden automatisch entfernt"
          if msg not in changelog:
              changelog.append(msg)
          data["changelog"] = changelog
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
          PY

          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EmbyFlowE2 Update Bot"
          git config user.email "actions@users.noreply.github.com"

          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json

          if ! git diff --cached --quiet; then
            git commit -m "Limit metadata cache lifetime to 48h build 2026090621"
            git push origin main
          fi

          if git rev-parse "refs/tags/build-2026090621" >/dev/null 2>&1; then
            echo "Tag build-2026090621 already exists locally."
          else
            git tag -a build-2026090621 -m "EmbyFlow E2 build 2026090621"
            git push origin build-2026090621
          fi

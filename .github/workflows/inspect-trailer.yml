name: Inspect trailer integration
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-trailer.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant source
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('EmbyFlowE2_BlueDetail_20261001_0110.py')
          s=p.read_text(); t=ast.parse(s)
          for n in t.body:
              if isinstance(n,ast.ClassDef) and any(x in n.name.lower() for x in ('client','api')):
                  print('CLASS',n.name,[x.name for x in n.body if isinstance(x,ast.FunctionDef)])
              if isinstance(n,ast.FunctionDef) and (n.name in ('emby_enrich_detail_data','_embyflow_theme_stop_v1','_skyfall_local_theme_stop','_embyflow_theme_volume_release') or 'trailer' in n.name.lower()):
                  print(ast.get_source_segment(s,n))
              if isinstance(n,ast.ClassDef) and n.name=='EmbyFlowDetailScreen':
                  for f in n.body:
                      if isinstance(f,ast.FunctionDef) and f.name in ('play_selected','play_test_movie','_fallback_detail_poll'):
                          print(ast.get_source_segment(s,f))
          PY

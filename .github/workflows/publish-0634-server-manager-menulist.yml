name: Server manager MenuList build 2026090634

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0634-server-manager-menulist.yml'

permissions:
  contents: write

concurrency:
  group: embyflow-server-manager-menulist-2026090634
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish robust MenuList server manager
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_0634.py
          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090634' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'from Components.MenuList import MenuList' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_SERVER_MANAGER_UI_V3_MENULIST_0634_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EmbyFlowE2 Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m 'Use MenuList server manager build 2026090634'
          git push origin main
          git tag -a build-2026090634 -m 'EmbyFlow E2 build 2026090634'
          git push origin build-2026090634

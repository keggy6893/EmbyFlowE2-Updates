name: Chapter cards single selected 2026090624

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chapter-cards-single-selected-0624.yml"

permissions:
  contents: write

concurrency:
  group: embyflow-chapter-cards-single-selected-2026090624
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selected-only chapter preview
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_0624_single_chapter.py
          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090624' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_CHAPTER_CARDS_V18_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_CHAPTER_CARDS_V18_SINGLE_SELECTED_0624_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_LOGINREF17_DREAMSAFE2_HTTPPOOL_NONBLOCK_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'MAX_STALE = 172800' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EmbyFlowE2 Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate only selected chapter preview build 2026090624"
            git push origin main
          fi
          if git rev-parse "refs/tags/build-2026090624" >/dev/null 2>&1; then
            echo "Tag build-2026090624 already exists locally."
          else
            git tag -a build-2026090624 -m "EmbyFlow E2 build 2026090624"
            git push origin build-2026090624
          fi

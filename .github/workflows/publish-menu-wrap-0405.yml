name: Publish menu wrap fix 0405
on:
  push:
    branches: [main]
    paths:
      - release_tools/build_menu_wrap_0405.py
      - release_tools/test_menu_wrap_0405.py
      - .github/workflows/publish-menu-wrap-0405.yml
permissions:
  contents: write
concurrency:
  group: publish-trailers
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and test
        run: |
          python3 release_tools/build_menu_wrap_0405.py
          python3 release_tools/test_menu_wrap_0405.py
          python3 release_tools/test_current_images_0401.py
          python3 release_tools/test_detail_cleanup_0401.py
          python3 tools/trailers/test_trailers.py
          python3 tools/blue-detail/test_tv_choice.py EmbyFlowE2_Menu_20261004_0405.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Python 3.14
        run: |
          python3 -m py_compile EmbyFlowE2_Menu_20261004_0405.py
          python3 release_tools/test_menu_wrap_0405.py
          python3 release_tools/test_current_images_0401.py
          python3 release_tools/test_detail_cleanup_0401.py
      - name: Publish update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EmbyFlowE2_Menu_20261004_0405.py update.json
          git commit -m 'Publish menu wrap fix build 2026100405'
          git push origin HEAD:main

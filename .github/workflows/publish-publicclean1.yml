name: Publish PUBLICCLEAN1

on:
  push:
    branches:
      - main
    paths:
      - PUBLICCLEAN1.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish PUBLICCLEAN1
        shell: bash
        run: |
          set -euo pipefail

          BASE="plugin_RCDEV7_SERVERSAFE1_LOGINREF4.py"
          TARGET="plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py"
          BUILD="2026090617"
          TAG="build-${BUILD}"
          EXPECTED_SHA="a380bb7b5879c31e6f99b4509b2382630605bcdb73d796c54e0224ce588e5e3e"

          test -f "$BASE"
          test -f PUBLICCLEAN1.patch.gz.b64

          cp "$BASE" "$TARGET"
          base64 -d PUBLICCLEAN1.patch.gz.b64 | gzip -d > /tmp/PUBLICCLEAN1.patch
          patch --batch -p0 < /tmp/PUBLICCLEAN1.patch

          python3 -m py_compile "$TARGET"
          SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$SHA" = "$EXPECTED_SHA"

          cat > update.json <<'JSON'
          {
            "version": "2026-RCDEV7-SERVERSAFE1-LOGINREF17-DREAMSAFE2-PUBLICCLEAN1",
            "build": 2026090617,
            "channel": "rcdev",
            "download": "https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/build-2026090617/plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py",
            "sha256": "a380bb7b5879c31e6f99b4509b2382630605bcdb73d796c54e0224ce588e5e3e",
            "target": "plugin.py",
            "artifact_type": "plugin_py",
            "changelog": [
              "4K HEVC/Main10/Dolby Vision: native Direct Play über Static=true statt unnötigem H.264-Volltranscode",
              "H.264 über 1920 Pixel Breite und AV1 behalten den sicheren H.264-Kompatibilitätsfallback",
              "HTTP-Pool: belegte Slots blockieren den nächsten Filmstart nicht mehr; Requests weichen non-blocking aus",
              "SERVERSAFE1: Stopped + ActiveEncodings-Cleanup bleiben für Transcode-/Ersatz-Sessions erhalten",
              "Resume/Seek und das eigene Untertitel-Auswahlmenü bleiben unverändert erhalten",
              "PUBLICCLEAN1: normale lokale Diagnose-/Testlogs sind standardmäßig deaktiviert; Fehler-/Crashlogs bleiben aktiv"
            ]
          }
          JSON

          python3 -m json.tool update.json >/dev/null

          git config user.name "EmbyFlowE2 Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$TARGET" update.json

          if ! git diff --cached --quiet; then
            git commit -m "Publish EmbyFlowE2 PUBLICCLEAN1 build ${BUILD}"
          fi

          COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            test "$EXISTING" = "$COMMIT"
          else
            git tag -a "$TAG" -m "EmbyFlowE2 PUBLICCLEAN1 build ${BUILD}"
            git push origin "$TAG"
          fi

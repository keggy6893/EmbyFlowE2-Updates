name: Server management build 2026090631

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0631-server-manager.yml'

permissions:
  contents: write

concurrency:
  group: embyflow-server-management-2026090631
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish server management
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import zlib

          plugin = Path('plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          manifest = Path('update.json')
          text = plugin.read_text(encoding='utf-8')

          if text.count('PLUGIN_UPDATE_BUILD = 2026090630') != 1:
              raise SystemExit('0630 baseline build marker mismatch')
          if '# EMBYFLOW_GERMAN_KEYBOARD_V22_0630_RELEASE' not in text:
              raise SystemExit('0630 German keyboard marker missing')
          if 'EMBYFLOW_SERVER_MANAGER_V1_0631_RELEASE' in text:
              raise SystemExit('0631 server manager already present')

          cls_start = text.find('class EmbyFlowConnectionWizard(Screen):')
          if cls_start < 0:
              raise SystemExit('Connection wizard class missing')
          cls_end = text.find('\ndef _embyflow_neon_advanced_skin():', cls_start)
          if cls_end < 0:
              raise SystemExit('Connection wizard class end missing')

          block = text[cls_start:cls_end]
          old_context = '["OkCancelActions", "DirectionActions", "ColorActions"],'
          if old_context not in block:
              raise SystemExit('Connection wizard action contexts not found')
          block = block.replace(
              old_context,
              '["OkCancelActions", "DirectionActions", "ColorActions", "MenuActions"],',
              1,
          )

          old_blue = '                "blue": self.show_help,\n'
          if old_blue not in block:
              raise SystemExit('Connection wizard blue/help action not found')
          block = block.replace(
              old_blue,
              old_blue + '                "menu": self.manage_server_slot,\n',
              1,
          )
          text = text[:cls_start] + block + text[cls_end:]

          patch = zlib.decompress(base64.b64decode(
              ''
          )).decode('utf-8')

          text = text.replace(
              'PLUGIN_UPDATE_BUILD = 2026090630',
              'PLUGIN_UPDATE_BUILD = 2026090631',
              1,
          )
          text += patch
          plugin.write_text(text, encoding='utf-8', newline='\n')

          final_sha = hashlib.sha256(plugin.read_bytes()).hexdigest()
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if int(data.get('build') or 0) != 2026090630:
              raise SystemExit('manifest baseline mismatch: %r' % data.get('build'))
          data['build'] = 2026090631
          data['download'] = 'https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/build-2026090631/plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          data['sha256'] = final_sha
          changelog = list(data.get('changelog') or [])
          messages = [
              'Serververwaltung 0631: MENU auf einer Serverkarte öffnet Verwenden, Bearbeiten, Löschen und Abbrechen',
              'Server löschen: Sicherheitsabfrage; nur der gewählte Slot wird entfernt und bei Bedarf der aktive Login sicher zurückgesetzt',
              'Server bearbeiten: vorhandene Adresse öffnet direkt die einheitliche EmbyFlow-Tastatur; leere Slots lassen sich wie bisher per OK einrichten',
          ]
          for msg in messages:
              if msg not in changelog:
                  changelog.append(msg)
          data['changelog'] = changelog
          manifest.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print('Final plugin sha256:', final_sha)
          PY

          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090631' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_GERMAN_KEYBOARD_V22_0630_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_SERVER_MANAGER_V1_0631_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q '"menu": self.manage_server_slot' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'wirklich löschen' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EmbyFlowE2 Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m 'Add server management build 2026090631'
          git push origin main
          git tag -a build-2026090631 -m 'EmbyFlow E2 build 2026090631'
          git push origin build-2026090631

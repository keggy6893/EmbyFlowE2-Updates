name: Server overview UI build 2026090636

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0636-server-overview-ui.yml'

permissions:
  contents: write

concurrency:
  group: embyflow-server-overview-2026090636
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build full EmbyFlow server overview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib

          plugin = Path('plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          manifest = Path('update.json')
          text = plugin.read_text(encoding='utf-8')

          if text.count('PLUGIN_UPDATE_BUILD = 2026090635') != 1:
              raise SystemExit('0635 baseline build marker mismatch')
          if text.count('# EMBYFLOW_SERVER_MANAGER_UI_V3_ZORDER_0635_RELEASE') != 1:
              raise SystemExit('0635 z-order marker missing or duplicated')
          if '# EMBYFLOW_SERVER_MANAGER_UI_V4_OVERVIEW_0636_RELEASE' in text:
              raise SystemExit('0636 overview already present')

          blob = ''
          patch = zlib.decompress(base64.b64decode(blob)).decode('utf-8')
          compile(patch, '<0636-patch>', 'exec')

          required = [
              '# EMBYFLOW_SERVER_MANAGER_UI_V4_OVERVIEW_0636_RELEASE',
              'class EmbyFlowServerManageScreenV4Overview(Screen):',
              'widget name="srv_sel_0"',
              'widget name="srv_sel_3"',
              'widget name="action_0"',
              'widget name="action_3"',
              'EmbyFlowConnectionWizard.manage_server_slot = _embyflow_server_manager_v4_open',
          ]
          for marker in required:
              if marker not in patch:
                  raise SystemExit('0636 required marker missing: %s' % marker)

          text += patch
          text = text.replace(
              'PLUGIN_UPDATE_BUILD = 2026090635',
              'PLUGIN_UPDATE_BUILD = 2026090636',
              1,
          )
          plugin.write_text(text, encoding='utf-8', newline='\n')
          final_sha = hashlib.sha256(plugin.read_bytes()).hexdigest()

          data = json.loads(manifest.read_text(encoding='utf-8'))
          if int(data.get('build') or 0) != 2026090635:
              raise SystemExit('manifest baseline mismatch: %r' % data.get('build'))
          data['build'] = 2026090636
          data['download'] = 'https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/build-2026090636/plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          data['sha256'] = final_sha
          changelog = list(data.get('changelog') or [])
          messages = [
              'Serververwaltung 0636: Vollbild-Zweispaltenansicht wie im freigegebenen EmbyFlow-Mock-up',
              '0636 links: alle vier Server-Slots gleichzeitig mit Adresse und Aktiv/Online/Offline-Status',
              '0636 rechts: ausgewählter Server mit Verwenden, Bearbeiten, Löschen und Abbrechen',
              '0636 Löschen: Sicherheitsabfrage direkt im EmbyFlow-Panel; keine native blaue ChoiceBox',
              '0636 OpenATV-Layering: dynamische Karten, Details und Aktionen liegen explizit über den Panel-Flächen',
          ]
          for msg in messages:
              if msg not in changelog:
                  changelog.append(msg)
          data['changelog'] = changelog
          manifest.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print('Final plugin sha256:', final_sha)
          PY

          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090636' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_SERVER_MANAGER_UI_V4_OVERVIEW_0636_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EmbyFlowConnectionWizard.manage_server_slot = _embyflow_server_manager_v4_open' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EmbyFlowE2 Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m 'Add full server overview UI build 2026090636'
          git push origin main
          git tag -a build-2026090636 -m 'EmbyFlow E2 build 2026090636'
          git push origin build-2026090636

name: Build and validate modular RC26.9 receiver candidate
on:
  push:
    branches: ['refactor/rc26-9-foundation']
    paths:
      - '.github/workflows/refactor-receiver-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check original release is untouched
        run: python3 tests/test_rc269_refactor_baseline.py
      - name: Build modular EmbyFlowE2 source
        run: python3 tools/build_modular_candidate.py
      - name: Test modularization behavior
        run: python3 tests/test_local_media_extraction.py
      - name: Check compatibility of candidate source
        run: |
          python3 - <<'PY'
          import ast,hashlib,pathlib
          source=pathlib.Path('plugin_2026111523.py').read_bytes()
          candidate=pathlib.Path('refactor_candidates/plugin_rc269_modular.py').read_bytes()
          assert len(source)>3900000 and len(candidate)>3900000
          assert source!=candidate
          assert b'from refactor_modules.local_media_utils import embyflow_local_human_size' in candidate
          assert b'from refactor_modules.local_media_utils import embyflow_local_clean_title' in candidate
          assert b'EMBYFLOW_CONTINUE_SAFE_DISPLAY_DEDUP_V1' in candidate
          assert b'EMBYFLOW_STARTUP_UPDATE_PROMPT_V1' in candidate
          assert b'PLUGIN_UPDATE_BUILD = 2026111523' in candidate
          ast.parse(candidate,filename='plugin_rc269_modular.py')
          print('MODULAR_CANDIDATE_OK SHA256='+hashlib.sha256(candidate).hexdigest())
          PY
      - name: Commit candidate on isolated branch, not official updater
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f refactor_candidates/plugin_rc269_modular.py
          if ! git diff --cached --quiet; then
            git commit -m 'Build RC26.9 modular receiver candidate (development only)'
            git push origin HEAD:refactor/rc26-9-foundation
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: embyflow-rc269-modular-receiver-candidate
          path: |
            refactor_candidates/plugin_rc269_modular.py
            refactor_modules/local_media_utils.py
          retention-days: 7

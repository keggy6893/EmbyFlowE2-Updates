name: German keyboard V22 build 2026090630

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0630-keyboard-srt.yml'

permissions:
  contents: write

concurrency:
  group: embyflow-german-keyboard-v22-2026090630
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish German keyboard V22
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import re
          import zlib

          plugin = Path('plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          manifest = Path('update.json')
          text = plugin.read_text(encoding='utf-8')

          if text.count('PLUGIN_UPDATE_BUILD = 2026090629') != 1:
              raise SystemExit('0629 baseline build marker mismatch')

          start_marker = '# EMBYFLOW_LOCAL_INPUT_UI_V19_START'
          end_marker = '# EMBYFLOW_LOCAL_INPUT_UI_V19_END'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('V19 keyboard start marker missing')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('V19 keyboard end marker missing')
          end += len(end_marker)
          if end < len(text) and text[end:end + 1] == '\n':
              end += 1

          keyboard = zlib.decompress(base64.b64decode(
              ''
          )).decode('utf-8')

          text = text[:start] + keyboard + text[end:]
          text = text.replace(
              'PLUGIN_UPDATE_BUILD = 2026090629',
              'PLUGIN_UPDATE_BUILD = 2026090630',
              1,
          )
          text = re.sub(
              r'PLUGIN_BUILD_DATE = "[^"]*"',
              'PLUGIN_BUILD_DATE = "07.09.2026"',
              text,
              count=1,
          )

          release_marker = '# EMBYFLOW_GERMAN_KEYBOARD_V22_0630_RELEASE'
          if release_marker not in text:
              text = text.rstrip() + '\n\n' + release_marker + '\n'

          required = (
              '# EMBYFLOW_GERMAN_KEYBOARD_V22',
              '_EMBYFLOW_V22_KEY_ROWS_SHIFT',
              'VirtualKeyBoard = EmbyFlowUniversalTextInputScreenV22',
              'text="Shift"',
              '# EMBYFLOW_UNIVERSAL_GERMAN_KEYBOARD_V22_END',
              release_marker,
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit('required keyboard marker missing: %s' % marker)

          if '(":", ";", "\\\"", "!", "?", "=",' not in text:
              raise SystemExit('double quote key missing from German keyboard')

          plugin.write_text(text, encoding='utf-8', newline='\n')
          final_sha = hashlib.sha256(plugin.read_bytes()).hexdigest()

          data = json.loads(manifest.read_text(encoding='utf-8'))
          if int(data.get('build') or 0) != 2026090629:
              raise SystemExit('manifest baseline mismatch: %r' % data.get('build'))

          data['build'] = 2026090630
          data['download'] = (
              'https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/'
              'build-2026090630/'
              'plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          )
          data['sha256'] = final_sha

          changelog = list(data.get('changelog') or [])
          messages = [
              'Tastatur V22: einheitliches deutsches QWERTZ-Layout für EmbyFlow-Eingaben mit ä/ö/ü/ß und deutscher Shift-Ebene',
              'Passwort-Sonderzeichen: doppeltes Anführungszeichen sowie §, €, $, %, &, /, \\, |, @, #, Klammern und weitere Zeichen direkt verfügbar',
              'Alle generischen EmbyFlow-Texteingaben verwenden die neue Tastatur; Passwort/API-Key/Token-Felder bleiben maskiert',
          ]
          for message in messages:
              if message not in changelog:
                  changelog.append(message)
          data['changelog'] = changelog

          manifest.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print('Final plugin sha256:', final_sha)
          PY

          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090630' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_GERMAN_KEYBOARD_V22_0630_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'VirtualKeyBoard = EmbyFlowUniversalTextInputScreenV22' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q '_EMBYFLOW_V22_KEY_ROWS_SHIFT' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          git diff --check

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EmbyFlowE2 Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m 'German keyboard V22 build 2026090630'
          git push origin main
          git tag -a build-2026090630 -m 'EmbyFlow E2 build 2026090630'
          git push origin build-2026090630

# trigger after workflow registration

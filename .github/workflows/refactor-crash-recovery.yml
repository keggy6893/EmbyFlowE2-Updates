name: Experimental crash-recovery update tests
on:
  push:
    branches: ['refactor/rc26-9-foundation']
    paths:
      - 'tools/recoverable_bundle.py'
      - 'tests/test_recoverable_bundle.py'
      - '.github/workflows/refactor-crash-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect original official RC26.9 release
        run: python3 tests/test_rc269_refactor_baseline.py
      - name: Test simulated crashes, rollback and safety
        run: python3 -m unittest discover -s tests -p 'test_*bundle.py' -v

name: Hybrid subtitles V2 2026090625

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hybrid-subtitles-0625-v2.yml"

permissions:
  contents: write

concurrency:
  group: embyflow-hybrid-subtitles-v2-2026090625
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hybrid subtitle engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          m=Path('update.json')
          raw=p.read_bytes()
          expected='196e1949b48904291ce08cce99331067032d9f7ab33d7876f33b9a5ab9eb623c'
          got=hashlib.sha256(raw).hexdigest()
          if got != expected:
              raise SystemExit('Unexpected 0624 baseline sha256: %s' % got)
          text=raw.decode('utf-8')
          if text.count('PLUGIN_UPDATE_BUILD = 2026090624') != 1:
              raise SystemExit('build marker mismatch')
          text=text.replace('PLUGIN_UPDATE_BUILD = 2026090624','PLUGIN_UPDATE_BUILD = 2026090625',1)
          old='Kapitelbilder V18: kein 6er-Vorladen mehr; nur das ausgewählte fehlende Kapitelbild wird erzeugt"'
          new='Kapitelbilder V18: kein 6er-Vorladen mehr; nur das ausgewählte fehlende Kapitelbild wird erzeugt|"\n    "Untertitel Hybrid V1: Textspuren direkt von Emby, Bitmap-/native Spuren wieder über Enigma2; eigenes UT-Menü bleibt unverändert"'
          if text.count(old) != 1:
              raise SystemExit('embedded changelog marker mismatch: %s' % text.count(old))
          text=text.replace(old,new,1)
          old_timeout='                    timeout=(5, 120),\n                    verify=True,\n'
          new_timeout='                    timeout=(3, 8),\n                    verify=True,\n'
          if text.count(old_timeout) != 1:
              raise SystemExit('subtitle timeout marker mismatch: %s' % text.count(old_timeout))
          text=text.replace(old_timeout,new_timeout,1)
          marker='# EMBYFLOW_CHAPTER_CARDS_V18_SINGLE_SELECTED_0624_RELEASE\n'
          if text.count(marker) != 1:
              raise SystemExit('0624 marker mismatch')
          fragment=Path('hybrid_subtitles_0625.inc.py').read_text(encoding='utf-8')
          if 'EMBYFLOW_HYBRID_SUBTITLES_0625_RELEASE' in text:
              raise SystemExit('0625 already present')
          text=text.replace(marker,marker+'\n'+fragment+'\n',1)
          p.write_text(text,encoding='utf-8',newline='\n')
          final_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          data=json.loads(m.read_text(encoding='utf-8'))
          if int(data.get('build') or 0) != 2026090624:
              raise SystemExit('manifest baseline mismatch')
          data['build']=2026090625
          data['download']='https://raw.githubusercontent.com/keggy6893/EmbyFlowE2-Updates/build-2026090625/plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          data['sha256']=final_sha
          msg='Untertitel Hybrid V1: Textspuren direkt von Emby, Bitmap-/native Spuren wieder über Enigma2; eigenes UT-Menü bleibt unverändert'
          changelog=list(data.get('changelog') or [])
          if msg not in changelog:
              changelog.append(msg)
          data['changelog']=changelog
          m.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          print('Final plugin sha256:',final_sha)
          PY

          python3 -m py_compile plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'PLUGIN_UPDATE_BUILD = 2026090625' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_HYBRID_SUBTITLES_0625_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_CHAPTER_CARDS_V18_SINGLE_SELECTED_0624_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'EMBYFLOW_LOGINREF17_DREAMSAFE2_HTTPPOOL_NONBLOCK_RELEASE' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py
          grep -q 'MAX_STALE = 172800' plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

      - name: Commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EmbyFlowE2 Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add plugin_RCDEV7_SERVERSAFE1_LOGINREF17_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m "Add hybrid subtitle engine build 2026090625"
          git push origin main
          git tag -a build-2026090625 -m "EmbyFlow E2 build 2026090625"
          git push origin build-2026090625

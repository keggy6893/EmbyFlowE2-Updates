name: Publish Dynamic Navigation V29 build 2026091002

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-1002-dynamic-nav-v29.yml'

permissions:
  contents: write

concurrency:
  group: embyflow-dynamic-nav-v29-2026091002
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Dynamic Navigation V29 into current public release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import lzma
          import re

          old_plugin = Path('plugin_RCDEV8_SERVERSAFE1_LOGINV21_FAVRES28_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          new_plugin = Path('plugin_RCDEV9_SERVERSAFE1_LOGINV21_FAVRES28_NAVV29_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py')
          manifest = Path('update.json')
          nav_pack = Path('Navigation/Navigation_V29.inc.py.xz.b64')

          old_version = '2026-RCDEV8-SERVERSAFE1-DREAMSAFE2-LOGINV21-FAVRES28-PUBLICCLEAN1'
          new_version = '2026-RCDEV9-SERVERSAFE1-DREAMSAFE2-LOGINV21-FAVRES28-NAVV29-PUBLICCLEAN1'
          old_build = 'PLUGIN_UPDATE_BUILD = 2026091001'
          new_build = 'PLUGIN_UPDATE_BUILD = 2026091002'

          for required in (old_plugin, manifest, nav_pack):
              if not required.is_file():
                  raise SystemExit('required release input missing: ' + str(required))
          if new_plugin.exists():
              raise SystemExit('1002 release plugin already exists')

          baseline = old_plugin.read_text(encoding='utf-8')
          if baseline.count('PLUGIN_VERSION = "%s"' % old_version) != 1:
              raise SystemExit('1001 baseline version marker mismatch')
          if baseline.count(old_build) != 1:
              raise SystemExit('1001 baseline build marker mismatch')
          if baseline.count('# EMBYFLOW_LOGIN_CONTEXT_PREVIEW_V21_START') != 1:
              raise SystemExit('Login V21 missing from 1001 baseline')
          if baseline.count('# EMBYFLOW_FAVORITE_RESOLUTION_V28_START') != 1:
              raise SystemExit('Favorites V28 missing from 1001 baseline')
          if '# EMBYFLOW_DYNAMIC_NAV_REFRESH_V29_START' in baseline:
              raise SystemExit('Navigation V29 already present in baseline')
          if 'EMBYFLOW_SCENEPEEK' in baseline or 'SCENEPEEK' in baseline:
              raise SystemExit('ScenePeek test code unexpectedly present in public baseline')

          encoded = b''.join(nav_pack.read_bytes().split())
          packed = base64.b64decode(encoded, validate=True)
          nav = lzma.decompress(packed).decode('utf-8')

          if hashlib.sha256(nav.encode('utf-8')).hexdigest() != 'ef2e31e03654714fd107bc70ffbf87a27997d68c056b44a2aae21ee4885be069':
              raise SystemExit('Navigation V29 feature pack hash mismatch')
          if nav.count('# EMBYFLOW_DYNAMIC_NAV_REFRESH_V29_START') != 1:
              raise SystemExit('Navigation V29 start marker mismatch')
          if nav.count('# EMBYFLOW_DYNAMIC_NAV_REFRESH_V29_END') != 1:
              raise SystemExit('Navigation V29 end marker mismatch')

          forbidden_pack = (
              'EMBYFLOW_UT_',
              'EMBYFLOW_SRT_',
              'WEBVTT',
              'PLEX_MIRROR_BURN',
              'SCENEPEEK',
              '192.168.1.11',
              'GoM6893',
              'streamboy',
          )
          for needle in forbidden_pack:
              if needle in nav:
                  raise SystemExit('forbidden test/private code in Navigation V29 pack: ' + needle)

          text = baseline
          text = text.replace(
              'PLUGIN_VERSION = "%s"' % old_version,
              'PLUGIN_VERSION = "%s"' % new_version,
              1,
          )
          text = text.replace(old_build, new_build, 1)
          text, date_count = re.subn(
              r'^PLUGIN_BUILD_DATE\s*=\s*"[^"]*"',
              'PLUGIN_BUILD_DATE = "10.09.2026"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if date_count != 1:
              raise SystemExit('PLUGIN_BUILD_DATE marker mismatch')

          changelog_open = 'PLUGIN_UPDATE_CHANGELOG = (\n'
          if text.count(changelog_open) != 1:
              raise SystemExit('PLUGIN_UPDATE_CHANGELOG marker mismatch')
          local_notes = (
              '    "Navigation V29: Server-Bibliotheken werden nach Login und Startup-Sync dynamisch aus den Benutzer-Views nachgeladen|"\n'
              '    "Navigation V29: Filme, Serien und weitere freigegebene Bibliotheken erscheinen wieder automatisch in der linken Navigation; Playback und Untertitel bleiben unverändert|"\n'
          )
          text = text.replace(changelog_open, changelog_open + local_notes, 1)
          text = text.rstrip() + '\n\n' + nav.strip() + '\n'

          compile(text, str(new_plugin), 'exec')
          if text.count('# EMBYFLOW_LOGIN_CONTEXT_PREVIEW_V21_START') != 1:
              raise SystemExit('final Login V21 marker mismatch')
          if text.count('# EMBYFLOW_FAVORITE_RESOLUTION_V28_START') != 1:
              raise SystemExit('final Favorites V28 marker mismatch')
          if text.count('# EMBYFLOW_DYNAMIC_NAV_REFRESH_V29_START') != 1:
              raise SystemExit('final Navigation V29 marker mismatch')
          if 'SCENEPEEK' in text:
              raise SystemExit('ScenePeek test code leaked into release')
          if text.count(new_build) != 1:
              raise SystemExit('final build marker mismatch')
          if text.count('PLUGIN_VERSION = "%s"' % new_version) != 1:
              raise SystemExit('final version marker mismatch')

          new_plugin.write_text(text, encoding='utf-8')
          sha256 = hashlib.sha256(new_plugin.read_bytes()).hexdigest()

          data = json.loads(manifest.read_text(encoding='utf-8'))
          if int(data.get('build', 0)) != 2026091001:
              raise SystemExit('update.json baseline build mismatch')
          data['version'] = new_version
          data['build'] = 2026091002
          data['channel'] = 'rcdev'
          data['download'] = (
              'https://raw.githubusercontent.com/keggy6893/'
              'EmbyFlowE2-Updates/build-2026091002/'
              'plugin_RCDEV9_SERVERSAFE1_LOGINV21_FAVRES28_NAVV29_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py'
          )
          data['sha256'] = sha256
          data['target'] = 'plugin.py'
          data['artifact_type'] = 'plugin_py'
          release_notes = [
              'Navigation V29: dynamische Emby-Bibliotheken werden nach Login und erfolgreichem Startup-Sync erneut aus /Users/{UserId}/Views geladen',
              'Navigation V29: freigegebene Filme-, Serien- und weitere Bibliotheken werden wieder in die linke Navigation eingefügt; bestehende Standardpunkte bleiben erhalten',
              'Release 1002 enthält keinen ScenePeek-Teststand und ändert weder Playback- noch Untertitelcode',
          ]
          data['changelog'] = release_notes + list(data.get('changelog') or [])
          manifest.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          print('release_file=' + str(new_plugin))
          print('sha256=' + sha256)
          print('size=' + str(new_plugin.stat().st_size))
          PY

          git diff --check
          python3 -m py_compile plugin_RCDEV9_SERVERSAFE1_LOGINV21_FAVRES28_NAVV29_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py

          git config user.name 'EmbyFlowE2 Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add plugin_RCDEV9_SERVERSAFE1_LOGINV21_FAVRES28_NAVV29_DREAMSAFE2_HTTPPOOL_PUBLICCLEAN1.py update.json
          git commit -m 'Publish Dynamic Navigation V29 build 2026091002'
          git push origin main
          git tag -a build-2026091002 -m 'EmbyFlow E2 build 2026091002'
          git push origin build-2026091002

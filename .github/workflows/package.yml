name: Build EmbyFlowE2 test package

on:
  push:
    branches: [openatv-feed-prep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh CI/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: embyflowe2-test-ipk
          path: dist/*.ipk
          if-no-files-found: error
